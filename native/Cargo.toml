[package]
name = "step-fast"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
glam = "0.30"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
blake3 = { version = "1", features = ["pure"] }
bytemuck = "1"
truck-stepio = { git = "https://github.com/ricosjp/truck", rev = "88ed005249e5e3a6b07f62425399435905cd3ab6" }
truck-meshalgo = { git = "https://github.com/ricosjp/truck", rev = "88ed005249e5e3a6b07f62425399435905cd3ab6" }
truck-assembly = { git = "https://github.com/ricosjp/truck", rev = "88ed005249e5e3a6b07f62425399435905cd3ab6" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

